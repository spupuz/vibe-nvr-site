site_name: VibeNVR Documentation
docs_dir: markdown_docs
site_dir: docs
theme:
  name: material
  custom_dir: overrides
  logo: assets/logo.png
  favicon: assets/logo.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - search.share
    - navigation.footer
    - content.code.copy

extra_css:
  - extra.css

nav:
  - Overview: index.md
  - Installation: Installation.md
  - Configuration: Configuration.md
  - Network Setup: Network.md
  - WebCodecs Streaming: Live-View-Streaming.md
  - Storage Profiles: Storage-Profiles.md
  - API Reference: API.md
  - Access Recovery: Access-Recovery.md
  - Privacy Masking: Privacy-Masking.md
  - Telemetry & Privacy: Telemetry.md
  - Decentralized Federation: Federation.md
  - System Architecture: Architecture.md
  - Troubleshooting: Troubleshooting.md
  - Backups and Restoration: Backups.md
  - ONVIF Management: ONVIF-Management.md
  - AI Detection: AI-Detection.md
  - MQTT Integration: MQTT-Integration.md
  - External Integrations: Integrations.md
  - Camera Settings: Camera-Settings.md
  - MFA Trusted Devices: MFA-Trusted-Devices.md
  - SSO & OAuth Integration: SSO-OAuth-Integration.md
  - Users and Roles: Users-and-Roles.md
  - Resource Optimization: Resource-Optimization.md
  - UniFi Integration: UniFi-Protect.md
  - Localization: Localization.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/spupuz/VibeNVR

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - attr_list
