<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VibeNVR - Modern Video Surveillance</title>
    <meta name="description" content="Simple, privacy-respecting local NVR — fast setup, flexible recording, no cloud required.">
    <!-- 🛡️ Sentinel: Added Content Security Policy (CSP) to mitigate XSS and restrict external assets -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://vibenvr-telemetry.spupuz.workers.dev https://cdn.buymeacoffee.com https://img.shields.io; connect-src 'self' https://vibenvr-telemetry.spupuz.workers.dev https://cdn.jsdelivr.net https://api.github.com; frame-src 'none'; object-src 'none'; base-uri 'self';">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Geist+Mono:wght@100..900&display=swap" rel="stylesheet">
    <link rel="preload" href="assets/vibenvr_video.webp" as="image" fetchpriority="high">
    <link rel="stylesheet" href="style.css?v=1.0.9">
    <link rel="icon" href="assets/logo.png" type="image/png">
    <!-- 🛡️ Sentinel: Added SRI checks to prevent malicious code injection if CDN is compromised -->
    <script type="module" src="https://cdn.jsdelivr.net/npm/ionicons@7.4.0/dist/ionicons/ionicons.esm.js" integrity="sha384-ka/QOj1/87D5umY1GYq4GS0y8e8vwy0Wj0BKvxJTWpNFUIarDm645Kvr8QaxM3jy" crossorigin="anonymous"></script>
    <script nomodule src="https://cdn.jsdelivr.net/npm/ionicons@7.4.0/dist/ionicons/ionicons.js" integrity="sha384-I7UNMgUrv6nA6xNHRbytUMytFlugSJWu/Il4VAV+Rhv73j9qaQqjf5IS1w9vHGsD" crossorigin="anonymous"></script>
</head>
<body>
    <div id="component-header"></div>
    <div id="component-hero"></div>
    <div id="component-gallery"></div>
    <div id="component-features"></div>
    <div id="component-architecture"></div>
    <div id="component-roadmap"></div>
    <div id="component-integrations"></div>
    <div id="component-docs"></div>
    <div id="component-install"></div>
    <div id="component-telemetry"></div>
    <div id="component-support"></div>
    <div id="component-footer"></div>
    <div id="component-scripts"></div>

    <script>
        async function loadComponents() {
            const components = ['header', 'hero', 'gallery', 'features', 'architecture', 'roadmap', 'integrations', 'docs', 'install', 'telemetry', 'support', 'footer', 'scripts'];
            const cacheBuster = '1.0.9'; // ⚡ Bolt: Use static version string instead of Date.now() to allow browser caching of static HTML fragments

            // ⚡ Bolt: Fetch all components concurrently to prevent network waterfall
            const fetchPromises = components.map(async (c) => {
                try {
                    const resp = await fetch(`src/${c}.html?v=${cacheBuster}`);
                    const html = await resp.text();
                    return { c, html, error: null };
                } catch (e) {
                    return { c, html: null, error: e };
                }
            });

            // ⚡ Bolt: Await concurrent fetches sequentially so earlier components render immediately
            for (const fetchPromise of fetchPromises) {
                const result = await fetchPromise;
                if (result.error) {
                    console.error("Failed to load component", result.c, result.error);
                    continue;
                }

                const container = document.getElementById(`component-${result.c}`);
                container.innerHTML = result.html;

                // Re-evaluate scripts to ensure they run globally
                const scripts = container.getElementsByTagName('script');
                for (let i = 0; i < scripts.length; i++) {
                    const newScript = document.createElement('script');
                    newScript.text = scripts[i].textContent;
                    document.body.appendChild(newScript);
                }
            }
        }
        loadComponents();
    </script>
</body>
</html>
