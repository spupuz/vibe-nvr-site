<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VibeNVR - Modern Video Surveillance</title>
    <meta name="description" content="Simple, privacy-respecting local NVR — fast setup, flexible recording, no cloud required.">
    <link rel="stylesheet" href="style.css?v=1.0.9">
    <link rel="icon" href="assets/logo.png" type="image/png">
    <script type="module" src="https://cdn.jsdelivr.net/npm/ionicons@7.4.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://cdn.jsdelivr.net/npm/ionicons@7.4.0/dist/ionicons/ionicons.js"></script>
</head>
<body>
    <div id="component-header"></div>
    <div id="component-hero"></div>
    <div id="component-gallery"></div>
    <div id="component-features"></div>
    <div id="component-architecture"></div>
    <div id="component-roadmap"></div>
    <div id="component-integrations"></div>
    <div id="component-docs"></div>
    <div id="component-install"></div>
    <div id="component-telemetry"></div>
    <div id="component-support"></div>
    <div id="component-footer"></div>
    <div id="component-scripts"></div>

    <script>
        async function loadComponents() {
            const components = ['header', 'hero', 'gallery', 'features', 'architecture', 'roadmap', 'integrations', 'docs', 'install', 'telemetry', 'support', 'footer', 'scripts'];
            const cacheBuster = Date.now();

            // ⚡ Bolt: Fetch all components concurrently to prevent network waterfall
            const fetchPromises = components.map(async (c) => {
                try {
                    const resp = await fetch(`src/${c}.html?v=${cacheBuster}`);
                    const html = await resp.text();
                    return { c, html, error: null };
                } catch (e) {
                    return { c, html: null, error: e };
                }
            });

            const results = await Promise.all(fetchPromises);

            for (const result of results) {
                if (result.error) {
                    console.error("Failed to load component", result.c, result.error);
                    continue;
                }

                const container = document.getElementById(`component-${result.c}`);
                container.innerHTML = result.html;

                // Re-evaluate scripts to ensure they run globally
                const scripts = container.getElementsByTagName('script');
                for (let i = 0; i < scripts.length; i++) {
                    const newScript = document.createElement('script');
                    newScript.text = scripts[i].innerText;
                    document.body.appendChild(newScript);
                }
            }
        }
        loadComponents();
    </script>
</body>
</html>
