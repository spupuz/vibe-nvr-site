        <script>
            // ⚡ Bolt: Cache DOM elements in interactive functions to avoid repeated traversals
            let cachedGalleryScrollContainer = null;
            function scrollGallery(direction) {
                if (!cachedGalleryScrollContainer) {
                    cachedGalleryScrollContainer = document.querySelector('.gallery-scroll');
                }
                const container = cachedGalleryScrollContainer;
                const scrollAmount = 350 + 32; // item width + gap
                const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
                container.scrollBy({ left: direction * scrollAmount, behavior: reduceMotion ? 'auto' : 'smooth' });
            }
        </script>
