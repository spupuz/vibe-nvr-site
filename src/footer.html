    <script>
        (async function fetchVersions() {
            // 🛡️ Sentinel: Add AbortController for timeout to prevent hanging on external requests
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 5000);

            try {
                const siteRes = await fetch('https://api.github.com/repos/spupuz/vibe-nvr-site/releases/latest', { signal: controller.signal });
                clearTimeout(timeoutId);
                if (siteRes.ok) {
                    const siteData = await siteRes.json();
                    const siteEl = document.getElementById('site-version');
                    if (siteEl) siteEl.textContent = siteData.tag_name;
                }
            } catch (err) {
                console.error('Failed to fetch versions', err);
            }
        })();
    </script>
