<!-- Lightbox Modal -->
    <div id="lightbox" class="lightbox" onclick="if(event.target === this) closeLightbox()" role="dialog" aria-modal="true" aria-label="Image preview">
        <button class="lightbox-close" onclick="closeLightbox()" aria-label="Close image preview" title="Close image preview (Esc)">&times;</button>
        <img class="lightbox-content" id="lightbox-img" alt="Enlarged view">
    </div>

    <script>
        let lastFocusedElement = null;

        function openLightbox(src) {
            lastFocusedElement = document.activeElement;
            const lightbox = document.getElementById('lightbox');
            const lightboxImg = document.getElementById('lightbox-img');
            lightboxImg.src = src;
            lightbox.style.display = 'flex';
            document.body.style.overflow = 'hidden'; // Prevent scrolling

            // Focus the close button for keyboard accessibility
            const closeBtn = lightbox.querySelector('.lightbox-close');
            if (closeBtn) setTimeout(() => closeBtn.focus(), 50);
        }

        function closeLightbox() {
            const lightbox = document.getElementById('lightbox');
            lightbox.style.display = 'none';
            document.body.style.overflow = ''; // Restore scrolling

            if (lastFocusedElement) {
                lastFocusedElement.focus();
                lastFocusedElement = null;
            }
        }

        // Close on Escape key and handle Focus Trap for Lightbox
        let cachedLightbox = null;
        let cachedLightboxCloseBtn = null;
        document.addEventListener('keydown', function (event) {
            if (event.key !== 'Escape' && event.key !== 'Tab') return; // ⚡ Bolt: Early return to prevent DOM queries

            if (!cachedLightbox) {
                cachedLightbox = document.getElementById('lightbox');
            }
            const isActive = cachedLightbox && cachedLightbox.style.display === 'flex';

            if (!isActive) return;

            if (event.key === "Escape") {
                closeLightbox();
            }

            // Focus Trap for Lightbox Modal
            if (event.key === 'Tab') {
                if (!cachedLightboxCloseBtn) {
                    // ⚡ Bolt: Cache DOM queries inside high-frequency keydown events
                    cachedLightboxCloseBtn = cachedLightbox.querySelector('.lightbox-close');
                }
                const closeBtn = cachedLightboxCloseBtn;
                // Since closeBtn is the only focusable element in this modal, prevent default
                event.preventDefault();
                if (closeBtn) closeBtn.focus();
            }
        });

        // Auto-Scroll Gallery
        setTimeout(() => {
            const galleryScroll = document.querySelector('.gallery-scroll');
            if (!galleryScroll) return;

            let isPaused = false;
            let isVisible = false; // ⚡ Bolt: Track visibility
            let scrollInterval;

            // Pause on hover and focus
            galleryScroll.addEventListener('mouseenter', () => isPaused = true);
            galleryScroll.addEventListener('mouseleave', () => isPaused = false);
            galleryScroll.addEventListener('focusin', () => isPaused = true);
            galleryScroll.addEventListener('focusout', () => isPaused = false);

            // ⚡ Bolt: Only scroll when the gallery is in the viewport to save CPU and battery
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    isVisible = entry.isIntersecting;
                });
            }, { threshold: 0.1 });

            observer.observe(galleryScroll);

            // ⚡ Bolt: Cache layout properties outside the interval to prevent synchronous layout thrashing (reflows) every 3 seconds
            let cachedItemWidth = 0;
            let cachedScrollWidth = 0;
            let cachedClientWidth = 0;
            let cachedGalleryItem = null;

            function updateGalleryLayoutCache() {
                if (!galleryScroll) return;
                if (!cachedGalleryItem) {
                    cachedGalleryItem = galleryScroll.querySelector('.gallery-item');
                }
                if (!cachedGalleryItem) return;

                cachedItemWidth = cachedGalleryItem.clientWidth;
                cachedScrollWidth = galleryScroll.scrollWidth;
                cachedClientWidth = galleryScroll.clientWidth;
            }

            // ⚡ Bolt: Debounce layout queries to prevent synchronous thrashing during frequent events like resize or multiple image loads
            let layoutCacheTimeout;
            function debouncedUpdateGalleryLayoutCache() {
                clearTimeout(layoutCacheTimeout);
                layoutCacheTimeout = setTimeout(updateGalleryLayoutCache, 150);
            }

            // Initial cache and update on window resize
            updateGalleryLayoutCache();
            window.addEventListener('resize', debouncedUpdateGalleryLayoutCache);
            // Re-cache when gallery images load to ensure correct widths
            galleryScroll.querySelectorAll('img').forEach(img => {
                if (!img.complete) {
                    img.addEventListener('load', debouncedUpdateGalleryLayoutCache);
                }
            });

            function startAutoScroll() {
                scrollInterval = setInterval(() => {
                    if (!isPaused && isVisible && cachedItemWidth > 0) {
                        const gap = 32; // 2rem gap
                        const scrollAmount = cachedItemWidth + gap;

                        // Use a small buffer (10px) to account for floating point inaccuracies
                        // Dynamically read scrollLeft as it changes, but rely on cached dimensions for the rest
                        if (galleryScroll.scrollLeft + cachedClientWidth >= cachedScrollWidth - 10) {
                            galleryScroll.scrollTo({ left: 0, behavior: 'smooth' });
                        } else {
                            galleryScroll.scrollBy({ left: scrollAmount, behavior: 'smooth' });
                        }
                    }
                }, 3000); // Scroll every 3 seconds
            }

            startAutoScroll();
        });
    </script>
    <!-- Site Telemetry -->
    <script>
        (function () {
            const sendTelemetry = () => {
                try {
                    // Generate or retrieve a persistent anonymous visitor ID
                    let vid = localStorage.getItem('viben_vid');
                    if (!vid) {
                        // 🛡️ Sentinel: Use cryptographically secure random UUID if available, fallback to Math.random
                        if (window.crypto && window.crypto.randomUUID) {
                            vid = 'v_' + window.crypto.randomUUID().replace(/-/g, '');
                        } else if (window.crypto && window.crypto.getRandomValues) {
                            const array = new Uint32Array(4);
                            window.crypto.getRandomValues(array);
                            vid = 'v_' + Array.from(array, dec => dec.toString(36).padStart(7, '0')).join('').substring(0, 16) + Date.now().toString(36);
                        } else {
                            vid = 'v_' + Math.random().toString(36).substring(2, 10) + Date.now().toString(36);
                        }
                        localStorage.setItem('viben_vid', vid);
                    }

                    // Ping the telemetry worker
                    const url = new URL('https://vibenvr-telemetry.spupuz.workers.dev/site-telemetry.png');
                    url.searchParams.set('visitor_id', vid);
                    const img = new Image();
                    img.referrerPolicy = 'no-referrer-when-downgrade';
                    // ⚡ Bolt: Trigger network request without appending to DOM to avoid layout recalculation
                    img.src = url.toString();
                } catch (e) {
                    // Ignore tracking errors to prevent breaking the main page
                }
            };

            // ⚡ Bolt: Defer non-critical telemetry to avoid blocking the main thread during initial load
            if ('requestIdleCallback' in window) {
                requestIdleCallback(sendTelemetry);
            } else {
                setTimeout(sendTelemetry, 1000); // Fallback for Safari
            }
        })();
    </script>
    <div class="nav-overlay" onclick="toggleMenu()"></div>

    <script>
        let mobileMenuLastFocusedElement = null;

        function closeMenu() {
            const nav = document.querySelector(".nav-links");
            const overlay = document.querySelector(".nav-overlay");
            const icon = document.getElementById("menu-icon");
            const toggleBtn = document.querySelector(".mobile-toggle");
            
            if(nav.classList.contains("active")) {
                nav.classList.remove("active");
                overlay.classList.remove("active");
                icon.setAttribute("name", "menu-outline");
                if (toggleBtn) {
                    toggleBtn.setAttribute("aria-expanded", "false");
                    toggleBtn.setAttribute("aria-label", "Toggle Menu");
                    toggleBtn.setAttribute("title", "Toggle Menu (Esc)");
                }

                if (mobileMenuLastFocusedElement) {
                    mobileMenuLastFocusedElement.focus();
                    mobileMenuLastFocusedElement = null;
                }
            }
        }

        function toggleMenu() {
            const nav = document.querySelector(".nav-links");
            const overlay = document.querySelector(".nav-overlay");
            const icon = document.getElementById("menu-icon");
            const toggleBtn = document.querySelector(".mobile-toggle");
            
            if (!nav.classList.contains("active")) {
                // Opening
                mobileMenuLastFocusedElement = document.activeElement;
                nav.classList.add("active");
                overlay.classList.add("active");
                icon.setAttribute("name", "close-outline");
                if (toggleBtn) {
                    toggleBtn.setAttribute("aria-expanded", "true");
                    toggleBtn.setAttribute("aria-label", "Close Menu");
                    toggleBtn.setAttribute("title", "Close Menu (Esc)");
                }

                // Focus first link in menu for accessibility
                const firstLink = nav.querySelector('a');
                if (firstLink) setTimeout(() => firstLink.focus(), 50);
            } else {
                // Closing
                closeMenu();
            }
        }

        // Close menu when a link is clicked
        document.querySelectorAll(".nav-links a").forEach(link => {
            link.addEventListener("click", (e) => {
                // If navigating to an in-page section, do not restore focus to the menu toggle
                // because it forcefully interrupts the user's focus flow to the new section.
                const href = link.getAttribute("href");
                if (href && href.startsWith("#")) {
                    mobileMenuLastFocusedElement = null;
                }
                closeMenu();
            });
        });

        // Close menu on Escape key and handle Focus Trap
        let cachedNav = null;
        let cachedToggleBtn = null;
        document.addEventListener('keydown', function(event) {
            if (event.key !== 'Escape' && event.key !== 'Tab') return; // ⚡ Bolt: Early return to prevent DOM queries

            if (!cachedNav) {
                cachedNav = document.querySelector(".nav-links");
            }
            const isActive = cachedNav && cachedNav.classList.contains("active");

            if (event.key === "Escape" && isActive) {
                closeMenu();
            }

            // Focus Trap for Mobile Menu
            if (event.key === 'Tab' && isActive) {
                // ⚡ Bolt: Re-query focusable elements to prevent memory leaks or broken state if DOM changes
                const focusableElements = Array.from(cachedNav.querySelectorAll('a, button, input, textarea, select, details, [tabindex]:not([tabindex="-1"])'));
                if (!cachedToggleBtn) {
                    cachedToggleBtn = document.querySelector(".mobile-toggle");
                }

                // Add toggleBtn to the end of the focusableElements array to strictly match the DOM order
                if (cachedToggleBtn) {
                    focusableElements.push(cachedToggleBtn);
                }

                if (focusableElements.length === 0) return;

                const firstElement = focusableElements[0];
                const lastElement = focusableElements[focusableElements.length - 1];

                if (event.shiftKey) { // Shift + Tab
                    if (document.activeElement === firstElement) {
                        lastElement.focus();
                        event.preventDefault();
                    }
                } else { // Tab
                    if (document.activeElement === lastElement) {
                        firstElement.focus();
                        event.preventDefault();
                    }
                }
            }
        });
    </script>
    <script>
        // Scroll Reveal Animation Logic
        (function() {
            // First, dynamically add the 'reveal' class to sections and cards
            const sections = document.querySelectorAll("section:not(#hero)");
            sections.forEach(sec => sec.classList.add("reveal"));
            
            const cards = document.querySelectorAll(".card");
            cards.forEach((card, index) => {
                card.classList.add("reveal");
                // Add staggered delay based on index for grid items
                const delay = (index % 3) + 1;
                card.classList.add(`reveal-delay-${delay}`);
            });

            // Initialize Intersection Observer
            const observerOptions = {
                root: null,
                rootMargin: "0px",
                threshold: 0.15
            };

            const observer = new IntersectionObserver((entries, observer) => {
                entries.forEach(entry => {
                    // Activate if intersecting, or if the element is already scrolled past (above viewport)
                    if (entry.isIntersecting || entry.boundingClientRect.top < 0) {
                        entry.target.classList.add("active");
                        // ⚡ Bolt: Clean up will-change after animation finishes (0.8s + max delay 0.45s = ~1250ms)
                        // using slightly higher timeout to be safe
                        setTimeout(() => {
                            entry.target.style.willChange = 'auto';
                        }, 1300);
                        observer.unobserve(entry.target); // Run once

                        // ⚡ Bolt: Clean up animation classes after completion (1500ms allows for 800ms transition + max 450ms stagger + buffer)
                        // This removes the 'will-change' property which consumes memory and can override local hover transitions
                        setTimeout(() => {
                            entry.target.classList.remove("reveal", "active", "reveal-delay-1", "reveal-delay-2", "reveal-delay-3");
                        }, 1500);
                    }
                });
            }, observerOptions);

            // Observe all elements with the 'reveal' class
            document.querySelectorAll(".reveal").forEach(el => observer.observe(el));
        })();

        // Smart Footer Logic (Hide during scroll, show when stopped)
        // ⚡ Bolt: Cached DOM element and used requestAnimationFrame to prevent scroll jank
        (function() {
            let scrollTimeout;
            let isTicking = false;
            let cachedFooter = null;

            window.addEventListener('scroll', () => {
                if (!isTicking) {
                    // ⚡ Bolt: Read layout properties outside of requestAnimationFrame to prevent layout thrashing
                    const currentScrollY = window.scrollY;
                    window.requestAnimationFrame(() => {
                        if (!cachedFooter) cachedFooter = document.getElementById('smart-footer');
                        if (cachedFooter) {
                            if (currentScrollY > 50) {
                                cachedFooter.classList.add('hidden');
                            } else {
                                cachedFooter.classList.remove('hidden');
                            }

                            clearTimeout(scrollTimeout);
                            scrollTimeout = setTimeout(() => {
                                cachedFooter.classList.remove('hidden');
                            }, 400); // Wait 400ms after scrolling stops to show
                        }
                        isTicking = false;
                    });
                    isTicking = true;
                }
            }, { passive: true });
        })();
    </script>
