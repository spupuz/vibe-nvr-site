<!-- Lightbox Modal -->
    <div id="lightbox" class="lightbox" onclick="if(event.target === this) closeLightbox()" role="dialog" aria-modal="true" aria-label="Image preview">
        <button class="lightbox-close" onclick="closeLightbox()" aria-label="Close image preview">&times;</button>
        <img class="lightbox-content" id="lightbox-img" alt="Enlarged view">
    </div>

    <script>
        function openLightbox(src) {
            const lightbox = document.getElementById('lightbox');
            const lightboxImg = document.getElementById('lightbox-img');
            lightboxImg.src = src;
            lightbox.style.display = 'flex';
            document.body.style.overflow = 'hidden'; // Prevent scrolling

            // Focus the close button for keyboard accessibility
            const closeBtn = lightbox.querySelector('.lightbox-close');
            if (closeBtn) setTimeout(() => closeBtn.focus(), 50);
        }

        function closeLightbox() {
            const lightbox = document.getElementById('lightbox');
            lightbox.style.display = 'none';
            document.body.style.overflow = ''; // Restore scrolling
        }

        // Close on Escape key
        document.addEventListener('keydown', function (event) {
            if (event.key === "Escape") {
                closeLightbox();
            }
        });

        // Auto-Scroll Gallery
        setTimeout(() => {
            const galleryScroll = document.querySelector('.gallery-scroll');
            let isPaused = false;
            let scrollInterval;

            // Pause on hover and focus
            galleryScroll.addEventListener('mouseenter', () => isPaused = true);
            galleryScroll.addEventListener('mouseleave', () => isPaused = false);
            galleryScroll.addEventListener('focusin', () => isPaused = true);
            galleryScroll.addEventListener('focusout', () => isPaused = false);

            function startAutoScroll() {
                scrollInterval = setInterval(() => {
                    if (!isPaused) {
                        const itemWidth = galleryScroll.querySelector('.gallery-item').clientWidth;
                        const gap = 32; // 2rem gap
                        const scrollAmount = itemWidth + gap;

                        // Check if we reached the end
                        // Use a small buffer (10px) to account for floating point inaccuracies
                        if (galleryScroll.scrollLeft + galleryScroll.clientWidth >= galleryScroll.scrollWidth - 10) {
                            galleryScroll.scrollTo({ left: 0, behavior: 'smooth' });
                        } else {
                            galleryScroll.scrollBy({ left: scrollAmount, behavior: 'smooth' });
                        }
                    }
                }, 3000); // Scroll every 3 seconds
            }

            startAutoScroll();
        });
    </script>
    <!-- Site Telemetry -->
    <script>
        (function () {
            try {
                // Generate or retrieve a persistent anonymous visitor ID
                let vid = localStorage.getItem('viben_vid');
                if (!vid) {
                    vid = 'v_' + Math.random().toString(36).substring(2, 10) + Date.now().toString(36);
                    localStorage.setItem('viben_vid', vid);
                }

                // Ping the telemetry worker
                const url = new URL('https://vibenvr-telemetry.spupuz.workers.dev/site-telemetry.png');
                url.searchParams.set('visitor_id', vid);
                url.searchParams.set('path', window.location.pathname);

                const img = new Image();
                img.referrerPolicy = 'no-referrer-when-downgrade';
                img.style.position = 'absolute';
                img.style.width = '1px';
                img.style.height = '1px';
                img.style.opacity = '0';
                img.src = url.toString();
                document.body.appendChild(img);
            } catch (e) {
                // Ignore tracking errors to prevent breaking the main page
            }
        })();
    </script>
    <div class="nav-overlay" onclick="toggleMenu()"></div>

    <script>
        function toggleMenu() {
            const nav = document.querySelector(".nav-links");
            const overlay = document.querySelector(".nav-overlay");
            const icon = document.getElementById("menu-icon");
            const toggleBtn = document.querySelector(".mobile-toggle");
            
            nav.classList.toggle("active");
            overlay.classList.toggle("active");
            
            if (nav.classList.contains("active")) {
                icon.setAttribute("name", "close-outline");
                if (toggleBtn) toggleBtn.setAttribute("aria-expanded", "true");
            } else {
                icon.setAttribute("name", "menu-outline");
                if (toggleBtn) toggleBtn.setAttribute("aria-expanded", "false");
            }
        }

        // Close menu when a link is clicked
        document.querySelectorAll(".nav-links a").forEach(link => {
            link.addEventListener("click", () => {
                const nav = document.querySelector(".nav-links");
                const overlay = document.querySelector(".nav-overlay");
                const icon = document.getElementById("menu-icon");
                const toggleBtn = document.querySelector(".mobile-toggle");
                if(nav.classList.contains("active")) {
                    nav.classList.remove("active");
                    overlay.classList.remove("active");
                    icon.setAttribute("name", "menu-outline");
                    if (toggleBtn) toggleBtn.setAttribute("aria-expanded", "false");
                }
            });
        });
    </script>
    <script>
        // Scroll Reveal Animation Logic
        (function() {
            // First, dynamically add the 'reveal' class to sections and cards
            const sections = document.querySelectorAll("section:not(#hero)");
            sections.forEach(sec => sec.classList.add("reveal"));
            
            const cards = document.querySelectorAll(".card");
            cards.forEach((card, index) => {
                card.classList.add("reveal");
                // Add staggered delay based on index for grid items
                const delay = (index % 3) + 1;
                card.classList.add(`reveal-delay-${delay}`);
            });

            // Initialize Intersection Observer
            const observerOptions = {
                root: null,
                rootMargin: "0px",
                threshold: 0.15
            };

            const observer = new IntersectionObserver((entries, observer) => {
                entries.forEach(entry => {
                    // Activate if intersecting, or if the element is already scrolled past (above viewport)
                    if (entry.isIntersecting || entry.boundingClientRect.top < 0) {
                        entry.target.classList.add("active");
                        observer.unobserve(entry.target); // Run once
                    }
                });
            }, observerOptions);

            // Observe all elements with the 'reveal' class
            document.querySelectorAll(".reveal").forEach(el => observer.observe(el));
        })();

        // Smart Footer Logic (Hide during scroll, show when stopped)
        (function() {
            let scrollTimeout;
            window.addEventListener('scroll', () => {
                const footer = document.getElementById('smart-footer');
                if (!footer) return;
                
                // Add a small threshold so it doesn't flicker on tiny movements
                if (window.scrollY > 50) {
                    footer.classList.add('hidden');
                } else {
                    footer.classList.remove('hidden');
                }
                
                clearTimeout(scrollTimeout);
                scrollTimeout = setTimeout(() => {
                    footer.classList.remove('hidden');
                }, 400); // Wait 400ms after scrolling stops to show
            }, { passive: true });
        })();
    </script>
