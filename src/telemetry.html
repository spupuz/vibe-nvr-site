<!-- Telemetry Section -->
    <section id="telemetry"
        style="background-color: white; padding: 5rem 0; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);">
        <div class="container">
            <div class="section-title">
                <h2>Anonymous Telemetry</h2>
                <p>Aggregate, privacy-respecting usage stats from active VibeNVR installations.</p>
            </div>

            <!-- Live Stats Grid -->
            <div id="telemetry-grid"
                style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 1.5rem; margin-bottom: 2.5rem; max-width: 800px; margin-left: auto; margin-right: auto;">
                <!-- Cards injected by JS -->
                <div class="telemetry-card-skeleton"></div>
                <div class="telemetry-card-skeleton"></div>
                <div class="telemetry-card-skeleton"></div>
                <div class="telemetry-card-skeleton"></div>
                <div class="telemetry-card-skeleton"></div>
                <div class="telemetry-card-skeleton"></div>
            </div>



            <!-- CTA -->
            <div class="text-center">
                <p style="color: var(--muted-foreground); margin-bottom: 1.5rem; font-size: 0.9rem;"
                    id="telemetry-updated">Loading live data&hellip;</p>
                <a href="https://vibenvr-telemetry.spupuz.workers.dev/" target="_blank" rel="noopener noreferrer" class="btn btn-secondary"
                    style="display:inline-flex; align-items:center; gap:0.5rem;">
                    <ion-icon name="bar-chart-outline"></ion-icon> Open Full Dashboard
                </a>
            </div>
        </div>
    </section>

    <style>
        .telemetry-stat-card {
            background: var(--card, #ffffff);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            gap: 0.5rem;
            transition: box-shadow 0.2s, transform 0.2s;
        }

        .telemetry-stat-card:hover,
        .telemetry-stat-card:focus-visible {
            box-shadow: var(--shadow-md);
            transform: translateY(-2px);
        }

        .telemetry-stat-card .stat-label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--foreground);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .telemetry-stat-card .stat-label ion-icon {
            color: var(--primary, #2563EB);
            font-size: 1.1rem;
        }

        .telemetry-stat-card .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--foreground);
            line-height: 1.1;
        }

        .telemetry-stat-card .stat-sub {
            font-size: 0.78rem;
            color: var(--muted-foreground);
        }

        .telemetry-card-skeleton {
            background-color: #f0f0f0;
            border-radius: var(--radius);
            height: 100px;
            position: relative;
            overflow: hidden;
        }

        .telemetry-card-skeleton::after {
            content: "";
            position: absolute;
            inset: 0;
            transform: translateX(-100%);
            background: linear-gradient(90deg, rgba(255, 255, 255, 0) 0, rgba(255, 255, 255, 0.4) 50%, rgba(255, 255, 255, 0) 100%);
            animation: shimmer 1.5s infinite;
        }

        @keyframes shimmer {
            100% {
                transform: translateX(100%);
            }
        }
    </style>

    <script>
        (function () {
            const API = 'https://vibenvr-telemetry.spupuz.workers.dev/api/stats';

            function createStatCard(icon, label, value, sub) {
                const card = document.createElement('div');
                card.className = 'telemetry-stat-card';

                const labelDiv = document.createElement('div');
                labelDiv.className = 'stat-label';

                const iconEl = document.createElement('ion-icon');
                iconEl.setAttribute('name', icon);
                labelDiv.appendChild(iconEl);
                labelDiv.appendChild(document.createTextNode(' ' + label));

                const valueDiv = document.createElement('div');
                valueDiv.className = 'stat-value';
                valueDiv.textContent = value;

                card.appendChild(labelDiv);
                card.appendChild(valueDiv);

                if (sub) {
                    const subDiv = document.createElement('div');
                    subDiv.className = 'stat-sub';
                    subDiv.textContent = sub;
                    card.appendChild(subDiv);
                }

                return card;
            }

            async function loadTelemetry() {
                // ⚡ Bolt: Cache telemetry API results with 5 min TTL in sessionStorage to avoid redundant network requests while preserving "live" aspect
                let d = null;
                let lastUpdated = null;
                const CACHE_TTL_MS = 5 * 60 * 1000; // 5 minutes

                try {
                    const cachedDataStr = sessionStorage.getItem('vibe_telemetry_data');
                    const cachedTimeStr = sessionStorage.getItem('vibe_telemetry_time');

                    if (cachedDataStr && cachedTimeStr) {
                        const cacheTime = parseInt(cachedTimeStr, 10);
                        if (Date.now() - cacheTime < CACHE_TTL_MS) {
                            d = JSON.parse(cachedDataStr);
                            lastUpdated = new Date(cacheTime);
                        }
                    }
                } catch (err) {
                    // Ignore sessionStorage access errors (e.g. in restricted iframes) and parsing errors
                }

                if (!d) {
                    // 🛡️ Sentinel: Add AbortController for timeout to prevent hanging on external requests
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 5000);

                    try {
                        const res = await fetch(API, { signal: controller.signal });
                        clearTimeout(timeoutId);
                        if (!res.ok) throw new Error('Network error');
                        d = await res.json();
                        lastUpdated = new Date();

                        // Cache the results safely
                        try {
                            sessionStorage.setItem('vibe_telemetry_data', JSON.stringify(d));
                            sessionStorage.setItem('vibe_telemetry_time', lastUpdated.getTime().toString());
                        } catch (cacheErr) {
                            // Ignore sessionStorage quota or access errors
                        }
                    } catch (e) {
                        const grid = document.getElementById('telemetry-grid');
                        grid.innerHTML = '';
                        const errorMsg = document.createElement('p');
                        errorMsg.style.cssText = 'color:var(--muted-foreground);text-align:center;grid-column:1/-1;';
                        errorMsg.textContent = 'Could not load telemetry data.';
                        grid.appendChild(errorMsg);

                        document.getElementById('telemetry-updated').textContent = '';
                        return; // Exit early on error
                    }
                }

                const grid = document.getElementById('telemetry-grid');
                grid.innerHTML = ''; // Clear skeleton loader safely

                // ⚡ Bolt: Batch DOM insertions using DocumentFragment to minimize reflows
                const fragment = document.createDocumentFragment();
                fragment.appendChild(createStatCard('pulse-outline', 'Active Installs', d.active_installs?.toString() ?? '0', 'Last 7 days'));
                fragment.appendChild(createStatCard('albums-outline', 'Total Installs', d.total_installs?.toString() ?? '0', 'All time distinct'));
                fragment.appendChild(createStatCard('videocam-outline', 'Cameras', d.total_cameras?.toString() ?? '0', 'Managed across active'));
                fragment.appendChild(createStatCard('film-outline', 'Events', d.total_events?.toString() ?? '0', 'Recordings / Detections'));
                grid.appendChild(fragment);

                document.getElementById('telemetry-updated').textContent =
                    `Live data · Last updated ${lastUpdated.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })} · Anonymous aggregate stats`;
            }

            // ⚡ Bolt: Defer API call using requestIdleCallback to avoid blocking the main thread during initial load, while ensuring it still runs without requiring scroll.
            if ('requestIdleCallback' in window) {
                requestIdleCallback(() => loadTelemetry());
            } else {
                setTimeout(loadTelemetry, 1000);
            }
        })();
    </script>
